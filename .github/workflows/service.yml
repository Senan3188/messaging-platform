name: Build and release service

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      dokploy-app-id:
        required: false
        type: string
    secrets:
      dokploy-api-key:
        required: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
          cache-dependency-path: |
            pom.xml
            ${{ inputs.service }}/pom.xml
      - name: Verify Maven module
        env:
          SERVICE: ${{ inputs.service }}
        run: mvn -B -ntp -f "$SERVICE/pom.xml" verify
      - uses: docker/setup-buildx-action@v4
      - name: Verify image build
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.service }}/Dockerfile

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ inputs.service }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Set registry image
        id: image
        env:
          SERVICE: ${{ inputs.service }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/$SERVICE" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.service }}/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:main
      - name: Request Dokploy deployment
        if: inputs.dokploy-app-id != ''
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_APP_ID: ${{ inputs.dokploy-app-id }}
          DOKPLOY_API_KEY: ${{ secrets.dokploy-api-key }}
        run: |
          if [[ "$DOKPLOY_URL" != https://* || -z "$DOKPLOY_API_KEY" ]]; then
            echo "::error::Configure an HTTPS DOKPLOY_URL and the DOKPLOY_API_KEY secret"
            exit 1
          fi
          jq -nc --arg id "$DOKPLOY_APP_ID" '{applicationId: $id}' |
            curl --fail --silent --output /dev/null --max-time 30 \
              -H "x-api-key: $DOKPLOY_API_KEY" -H 'Content-Type: application/json' \
              --data-binary @- "${DOKPLOY_URL%/}/api/application.deploy" \
            || { echo "::error::Dokploy rejected the deployment request or was unreachable"; exit 1; }
