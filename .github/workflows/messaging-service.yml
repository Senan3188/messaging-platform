name: messaging-service

on:
  pull_request:
    paths:
      - 'messaging-service/**'
      - 'pom.xml'
      - '.dockerignore'
      - '.github/workflows/messaging-service.yml'
      - '.github/workflows/service.yml'
  push:
    branches: [main]
    paths:
      - 'messaging-service/**'
      - 'pom.xml'
      - '.dockerignore'
      - '.github/workflows/messaging-service.yml'
      - '.github/workflows/service.yml'

permissions:
  contents: read
  packages: write

jobs:
  service:
    uses: ./.github/workflows/service.yml
    with:
      service: messaging-service
      dokploy-app-id: ${{ vars.DOKPLOY_MESSAGING_SERVICE_APP_ID }}
    secrets:
      dokploy-api-key: ${{ secrets.DOKPLOY_API_KEY }}
