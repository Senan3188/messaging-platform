name: realtime-gateway

on:
  pull_request:
    paths:
      - 'realtime-gateway/**'
      - 'pom.xml'
      - '.dockerignore'
      - '.github/workflows/realtime-gateway.yml'
      - '.github/workflows/service.yml'
  push:
    branches: [main]
    paths:
      - 'realtime-gateway/**'
      - 'pom.xml'
      - '.dockerignore'
      - '.github/workflows/realtime-gateway.yml'
      - '.github/workflows/service.yml'

permissions:
  contents: read
  packages: write

jobs:
  service:
    uses: ./.github/workflows/service.yml
    with:
      service: realtime-gateway
      dokploy-app-id: ${{ vars.DOKPLOY_REALTIME_GATEWAY_APP_ID }}
    secrets:
      dokploy-api-key: ${{ secrets.DOKPLOY_API_KEY }}
